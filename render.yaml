services:
  - type: web
    name: bluewave-bp-api
    runtime: dotnet
    plan: free
    rootDir: backend/BlueWave-BP/BlueWave-BP.API
    buildCommand: dotnet restore && dotnet publish -c Release -o out
    startCommand: dotnet out/BlueWave-BP.API.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Cors__AllowVercelPreviewOrigins
        value: false
      - key: Cors__AllowedOrigins
        value: https://your-project.vercel.app
      - key: ConnectionStrings__DefaultConnection
        sync: false
